<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Placed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow p-4">

        <h3 class="mb-4 text-center">Order Summary</h3>
<p class="text-success">
    Free delivery on orders above ₹500
</p>

<table class="table table-bordered">
    <thead class="table-light">
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="item : ${order.items}">
            <td th:text="${item.productName}"></td>
            <td>₹ <span th:text="${item.price}"></span></td>
            <td th:text="${item.quantity}"></td>
            <td>₹ 
                <span th:text="${item.price * item.quantity}"></span>
            </td>
        </tr>
    </tbody>
</table>


<div class="card p-4 shadow mt-4">

    <table class="table">
        <tr>
            <th>Subtotal</th>
            <td class="text-end">
                ₹ <span th:text="${order.subtotal}"></span>
            </td>
        </tr>

        <tr>
            <th>Handling Charges</th>
            <td class="text-end">
                ₹ <span th:text="${order.handlingCharges}"></span>
            </td>
        </tr>

        <tr>
            <th>Delivery Charges</th>
            <td class="text-end">
                <span th:if="${order.deliveryCharges == 0}"
                      class="text-success">FREE</span>
                <span th:if="${order.deliveryCharges != 0}">
                    ₹ <span th:text="${order.deliveryCharges}"></span>
                </span>
            </td>
        </tr>

        <tr class="fw-bold fs-5">
            <th>Grand Total</th>
            <td class="text-end text-danger">
                ₹ <span th:text="${order.totalAmount}"></span>
            </td>
        </tr>
    </table>

</div>


        <div class="text-center mt-4">
            <a th:href="@{/confirm/{id}(id=${order.id})}"
               class="btn btn-danger">
                Confirm Order
            </a>
        </div>

    </div>
</div>


</body>
</html>
