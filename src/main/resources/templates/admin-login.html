<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Admin Login</title>
<link rel="stylesheet" href="/css/admin.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

.login-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-card{
    background:white;
    padding:35px;
    width:380px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.login-card h2{
    text-align:center;
    margin-bottom:25px;
}

.login-card input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:6px;
}

.login-btn{
    width:100%;
    padding:12px;
    background:#8B0000;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.login-btn:hover{
    background:#6f0000;
}

</style>

</head>

<body>

<div class="login-wrapper">

<div class="login-card">
<h1 style="text-align:center;color:#8B0000;">
Lalitha Surya Sweets Admin
</h1>
<h2>🔐 Admin Login</h2>

<form method="post" th:action="@{/admin/login}">

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button class="login-btn">Login</button>

</form>

</div>

</div>

</body>
</html>
