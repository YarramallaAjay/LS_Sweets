

<div th:fragment="content">

<h2>Products</h2>

<div style="margin-bottom:20px;">
    <a th:href="@{/admin/products/add}" class="btn">➕ Add Product</a>
</div>

<table>
<thead>
<tr>
<th>Image</th>
<th>Name</th>
<th>Category</th>
<th>Prices</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody>

<tr th:each="p : ${products}">

<td>
    <img th:src="${p.imageUrl}" width="60">
</td>

<td th:text="${p.name}"></td>

<td th:text="${p.category}"></td>

<td>
<div th:each="price : ${p.prices}">
    <span th:text="${price.label}"></span> -
    ₹<span th:text="${price.price}"></span>
</div>
</td>

<td>
<form th:action="@{/admin/products/toggle/{id}(id=${p.id})}" 
      method="post">

    <button type="submit"
            th:text="${p.enabled} ? 'Disable' : 'Enable'">
    </button>

</form>

</td>

<td>

<a th:href="@{/admin/products/edit/{id}(id=${p.id})}">
    ✏ Edit
</a>

&nbsp;

<a th:href="@{/admin/products/delete/{id}(id=${p.id})}"
   onclick="return confirm('Delete product?')">
   🗑 Delete
</a>

</td>

</tr>

</tbody>
</table>

</div>
