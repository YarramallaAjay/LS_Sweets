<div th:fragment="content">

   <h2>Customers</h2>

   <table>
      <tr>
         <th>ID</th>
         <th>Name</th>
         <th>Email</th>
         <th>Phone</th>
         <th>Address</th>
         <th>State</th>
         <th>Pincode</th>
      </tr>

      <tr th:each="c : ${customers}">
         <td th:text="${c.id}"></td>
         <td th:text="${c.name}"></td>
         <td th:text="${c.email}"></td>
         <td th:text="${c.phone}"></td>
         <td th:text="${c.address}"></td>
		 <td th:text="${c.state}"></td>
		 <td th:text="${c.pincode}"></td>
      </tr>
   </table>

</div>
