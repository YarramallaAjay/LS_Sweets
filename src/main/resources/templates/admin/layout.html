<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Admin</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="admin-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
    		🍬 Lalitha Surya Sweets
    		
		</div>

        <nav>
            <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
            <a th:href="@{/admin/orders}">📦 Orders</a>
            <a th:href="@{/admin/products}">🍬 Products</a>
            <a th:href="@{/admin/customers}">👤 Customers</a>
            <a th:href="@{/admin/dashboard/recent-orders}">📦 Recent Orders</a>
        </nav>

		<li class="sidebar-item">

    	<form th:action="@{/logout}" method="post" class="logout-form">
        	<button type="submit" class="sidebar-link logout-btn">
            🚪 Logout</button>
    	</form>
    	</li>
    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <div class="topbar">
            <span>Admin Panel</span>
        </div>

        <section class="page">

            <!-- page injected here -->
            <div th:replace="~{${content}::content}"></div>

        </section>

    </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
