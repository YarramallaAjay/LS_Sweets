<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product</title>
<link rel="stylesheet" href="/css/admin.css">

<style>

.form-card{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

.form-card h2{
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
}

.price-row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.price-row input{
    flex:1;
}

.price-row button{
    background:#ef4444;
    border:none;
    color:white;
    padding:8px 10px;
    border-radius:6px;
    cursor:pointer;
}

.add-price-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.save-btn{
    margin-top:20px;
    background:#16a34a;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:hover{
    background:#15803d;
}

.checkbox-group{
    display:flex;
    gap:20px;
}

</style>

</head>

<body>

<div class="form-card">

<h2>➕ Add Product</h2>

<div th:if="${error}" style="color:red; margin-bottom:15px;">
    <span th:text="${error}"></span>
</div>

<form th:action="@{/admin/products/save}" th:object="${product}" method="post">

<input type="hidden" th:field="*{id}">

<div class="form-group">
<label>Name</label>
<input type="text" th:field="*{name}" required>
</div>

<div class="form-group">
<label>Category</label>
<input type="text" th:field="*{category}" required>
</div>

<div class="form-group">
<label>Description</label>
<textarea th:field="*{description}"></textarea>
</div>

<div class="form-group">
<label>Pricing Type</label>
<select th:field="*{pricingType}" id="pricingType" required>
<option value="">-- Select --</option>
<option value="WEIGHT">Weight Based</option>
<option value="UNIT">Unit Based</option>
</select>
</div>

<div class="form-group">
<h3>Prices</h3>

<div id="priceRows"></div>

<button type="button" class="add-price-btn" onclick="addPriceRow()">
+ Add Price
</button>

</div>

<template id="priceRowTemplate">
<div class="price-row">
<input type="text" name="priceLabels" placeholder="Label (250g / 1 box)" required>
<input type="number" step="0.01" name="priceValues" placeholder="Price" required>
<button type="button" onclick="removeRow(this)">❌</button>
</div>
</template>

<div class="form-group">
<label>Image URL</label>
<input type="text" th:field="*{imageUrl}">
</div>

<div class="form-group checkbox-group">

<label>
<input type="checkbox" th:field="*{featured}">
Featured
</label>

<label>
<input type="checkbox" th:field="*{enabled}">
Enabled
</label>

</div>

<button type="submit" class="save-btn">
Save Product
</button>

</form>

</div>

<script>
const pricingTypeSelect = document.getElementById("pricingType");
const priceRows = document.getElementById("priceRows");
const template = document.getElementById("priceRowTemplate");

pricingTypeSelect.addEventListener("change", () => {
    priceRows.innerHTML = "";
    addPriceRow();
});

function addPriceRow(){
    const clone = template.content.cloneNode(true);
    priceRows.appendChild(clone);
}

function removeRow(btn){
    btn.parentElement.remove();
}
</script>

</body>
</html>
