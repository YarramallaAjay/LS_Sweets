<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Success</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .success-wrapper {
            max-width: 700px;
            margin: 80px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        .success-icon {
            font-size: 60px;
            color: #28a745;
        }

        .order-details {
            text-align: left;
            margin-top: 30px;
            padding: 20px;
            background: #f1f3f5;
            border-radius: 8px;
        }

        .order-details p {
            margin: 8px 0;
            font-size: 16px;
        }

        .btn-custom {
            display: inline-block;
            padding: 10px 20px;
            margin: 15px 10px 0;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #dc3545;
            color: white;
        }

        .btn-secondary {
            background-color: #343a40;
            color: white;
        }

        .btn-primary:hover,
        .btn-secondary:hover {
            opacity: 0.9;
        }
        
        .success-icon {
    font-size: 70px;
    animation: pop 0.4s ease-out;
}

@keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
    </style>
</head>
<body>

<div class="success-wrapper">

    <div class="success-icon">🎉</div>

    <h1 style="color:#28a745; margin-bottom:10px;">
        Order Confirmed!
    </h1>

    <p style="font-size:18px; color:#555;">
        Thank you for choosing <b>Lalitha Surya Sweets</b>.
        Your delicious treats are being prepared! 🍬
    </p>

    <div class="order-details">
        <p><b>Order ID:</b> #<span th:text="${order.id}"></span></p>
        <p><b>Customer:</b> <span th:text="${order.customer.name}"></span></p>
        <p><b>Total Amount:</b> ₹ <span th:text="${order.totalAmount}"></span></p>
        <p><b>Status:</b> 
            <span style="color:#28a745; font-weight:bold;"
                  th:text="${order.status}"></span>
        </p>
        <p><b>Order Date:</b> 
            <span th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy hh:mm a')}"></span>
        </p>
    </div>

    <div style="margin-top:20px;">
        <p style="color:#666;">
            📞 For any queries, contact us on WhatsApp.
        </p>

        <a href="https://wa.me/9133777448"
           target="_blank"
           class="btn-custom"
           style="background:#25D366; color:white;">
           Chat on WhatsApp
        </a>
    </div>

    <div style="margin-top:30px;">
        <a href="/" class="btn-custom btn-primary">
            Continue Shopping
        </a>

        <a th:href="@{/checkout/invoice/{id}(id=${order.id})}"
           class="btn-custom btn-secondary">
            Download Invoice
        </a>
    </div>

</div>

</body>
</html>
